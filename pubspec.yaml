name: fortune_garden
description: "Shared Budgeting App"

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 상태관리 (Riverpod)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # 로컬 DB (drift ORM + SQLite)
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1

  # Shelf 로컬 서버 (CODEF 프록시)
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  http: ^1.2.1

  # 보안 (OS Keychain)
  flutter_secure_storage: ^9.0.0

  # 암호화 (AES-256)
  encrypt: ^5.0.3

  # 네트워크 상태
  connectivity_plus: ^6.0.3

  # 유틸
  intl: ^0.20.2
  freezed_annotation: ^2.4.1
  file_picker: ^10.3.10
  crypto: ^3.0.7
  go_router: ^17.1.0
  charset_converter: ^2.3.0
  flex_color_picker: ^3.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.5.4
  drift_dev: ^2.28.0
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.7.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
